<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta name="theme-color" content="#2a2a2e">
  <link rel="icon" href="/assets/img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    // Set before first paint so a dark-mode visitor never sees a white flash.
    try {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="top">
    <div class="nav__inner">{{nav}}
    </div>
  </header>

  <main id="main">
{{body}}
  </main>

  <footer class="footer">
    <div class="wrap">{{footer}}
    </div>
  </footer>

  <script src="/assets/js/site.js" defer></script>
</body>
</html>
